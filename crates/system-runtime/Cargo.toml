[package]
name = "reflexion-system-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# W2 revision 指纹：RustCrypto 的 SHA-2 实现，跨语言口径以它为准。
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# 超时/树杀需要按进程组发信号（kill -pgid）。
libc = "0.2"
