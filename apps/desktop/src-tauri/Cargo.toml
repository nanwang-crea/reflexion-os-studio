[package]
name = "reflexion-desktop"
version = "0.1.0"
description = "ReflexionOS Studio desktop host"
edition = "2021"

[lib]
name = "reflexion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# 进程组树杀（kill -pgid）：POSIX 上兜底收割 TS Runtime 及其子进程。
libc = "0.2"
