name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact_name: reflexion-os-studio-windows
          - platform: macos
            os: macos-latest
            artifact_name: reflexion-os-studio-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Verify cross-platform path regressions
        run: |
          cargo test --manifest-path crates/Cargo.toml list_native_nested_paths
          cargo test --manifest-path crates/Cargo.toml canonical_root_matches_created_and_deleted_paths
          cargo test --manifest-path crates/Cargo.toml path_lookup_finds_windows_exe
          pnpm --filter @reflexion-os-studio/runtime exec node --disable-warning=ExperimentalWarning --import ./test/set-test-data-dir.mjs --test test/handlers.test.mjs test/workspace-indexer.test.mjs

      - name: Build desktop installers
        run: pnpm build:desktop
        env:
          CI: true
      - name: Verify packaged workspace services
        run: node scripts/smoke-workspace.mjs --packaged

      - name: Upload Windows installers
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS installers
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
