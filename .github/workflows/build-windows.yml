name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact_name: reflexion-os-studio-windows
          - platform: macos
            os: macos-latest
            artifact_name: reflexion-os-studio-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Build desktop installers
        run: pnpm build:desktop
        env:
          CI: true
      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'reflexion-os-studio-portable'
          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portable | Out-Null

          Copy-Item `
            'apps/desktop/src-tauri/target/release/reflexion-desktop.exe' `
            (Join-Path $portable 'reflexion-desktop.exe')

          $resources = 'apps/desktop/src-tauri/target/release/resources'
          if (-not (Test-Path $resources)) {
            throw "Tauri resources directory not found: $resources"
          }
          Copy-Item $resources (Join-Path $portable 'resources') -Recurse

          Compress-Archive `
            -Path (Join-Path $portable '*') `
            -DestinationPath 'apps/desktop/src-tauri/target/release/reflexion-os-studio-portable.zip' `
            -Force

      - name: Upload Windows installers
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/reflexion-os-studio-portable.zip

      - name: Upload macOS installers
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
