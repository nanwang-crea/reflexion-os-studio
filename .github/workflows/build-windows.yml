name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            artifact_name: reflexion-os-studio-linux
          - platform: windows
            os: windows-latest
            artifact_name: reflexion-os-studio-windows
          - platform: macos
            os: macos-latest
            artifact_name: reflexion-os-studio-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install macOS CEF build dependencies
        if: matrix.platform == 'macos'
        run: brew install cmake ninja

      - name: Install Windows CEF build dependencies
        if: matrix.platform == 'windows'
        run: |
          choco install ninja --yes --no-progress
          cmake --version
          ninja --version

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting and lint
        run: |
          pnpm format:check
          pnpm lint

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Verify TypeScript
        run: |
          pnpm typecheck
          pnpm --filter @reflexion-os-studio/desktop typecheck

      - name: Verify cross-platform path regressions
        run: |
          cargo test --manifest-path crates/Cargo.toml list_native_nested_paths
          cargo test --manifest-path crates/Cargo.toml canonical_root_matches_created_and_deleted_paths
          cargo test --manifest-path crates/Cargo.toml path_lookup_finds_windows_exe
          cargo test --manifest-path crates/Cargo.toml filesystem::paths::tests
          cargo test --manifest-path crates/Cargo.toml sensitive::tests
          cargo test --manifest-path crates/Cargo.toml filesystem::dispatch::tests
          cargo test --manifest-path crates/Cargo.toml filesystem::read::tests
          pnpm --filter @reflexion-os-studio/runtime exec node --disable-warning=ExperimentalWarning --import ./test/set-test-data-dir.mjs --test test/handlers.test.mjs test/workspace-indexer.test.mjs

      - name: Verify terminal shell startup regressions
        run: |
          cargo test --manifest-path crates/Cargo.toml terminal::shell_command
          cargo test --manifest-path crates/Cargo.toml terminal::unix_shell
          pnpm --filter @reflexion-os-studio/runtime exec node --disable-warning=ExperimentalWarning --import ./test/set-test-data-dir.mjs --test test/user-shell-env.test.mjs

      - name: Verify MCP process launch regressions
        run: pnpm --filter @reflexion-os-studio/runtime exec node --disable-warning=ExperimentalWarning --import ./test/set-test-data-dir.mjs --test test/mcp.test.mjs test/mcp-launch.test.mjs

      - name: Verify desktop packaging regressions
        run: node --test scripts/test/windows-crt.test.mjs scripts/test/desktop-bundle.test.mjs

      - name: Verify Runtime reliability
        run: pnpm --filter @reflexion-os-studio/runtime exec node --import ./test/set-test-data-dir.mjs --test test/reliability.test.mjs test/run-admission.test.mjs test/run-lifecycle-faults.test.mjs test/queue.test.mjs test/resubmission.test.mjs test/operations.test.mjs test/context/request-budget.test.mjs test/execution/*.test.mjs

      - name: Verify multi-agent collaboration
        run: pnpm --filter @reflexion-os-studio/runtime exec node --import ./test/set-test-data-dir.mjs --test test/agent-roles.test.mjs test/agent-teams.test.mjs

      - name: Install Chromium for UI tests
        run: pnpm --filter @reflexion-os-studio/runtime exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/agent-browser

      - name: Verify Agent roles, collaboration and product UI
        run: pnpm --filter @reflexion-os-studio/desktop exec node --test --test-concurrency=1 test/agent-collaboration.test.mjs test/product-ui.test.mjs test/model-selection.test.mjs

      - name: Verify embedded browser isolation and background layout
        run: |
          pnpm --filter @reflexion-os-studio/runtime exec node --test test/browser-embedded.test.mjs
          pnpm --filter @reflexion-os-studio/runtime-client test
          pnpm --filter @reflexion-os-studio/desktop exec node --test test/browser-background.test.mjs

      - name: Build desktop installers
        run: pnpm build:desktop
        env:
          CI: true
          APPIMAGE_EXTRACT_AND_RUN: 1
      - name: Verify native browser adapters and release gates
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib browser::
      - name: Verify packaged workspace services
        run: node scripts/smoke-workspace.mjs --packaged

      - name: Verify installed Windows host startup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/windows/smoke-installed.ps1

      - name: Upload Linux installers
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Windows installers
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS installers
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
